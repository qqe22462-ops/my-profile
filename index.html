      @keyframes panBackground {

        20% { transform: scale(1.3) translate(-40px, -30px); }
        40% { transform: scale(1.25) translate(40px, -25px); }
        60% { transform: scale(1.35) translate(-30px, 35px); }

      .modal-btn:hover {

    <script>
      let isReadyToCopy = false;
      let obfuscatedCode = "";

      async function mainAction() {
        const script = document.getElementById("scriptBox");
        const button = document.getElementById("actionBtn");

        if (isReadyToCopy) {
          navigator.clipboard.writeText(script.value).then(() => {
            button.innerText = "คัดลอกสคริปต์สำเร็จ! ✓";

          return;
        }

        script.disabled = true;
        button.disabled = true;

          resetButtonNormal();
        }
      }

      function closeModalAndCopyMode() {
        // ปิด Modal
        document.getElementById("customModal").classList.remove("active");

        // เปลี่ยนพื้นหลังเป็นรูปใหม่ตามที่ต้องการ
        document.getElementById("bgAnimation").style.backgroundImage = 'url("https://i.postimg.cc/Xv3PnCcS/file-000000003afc820797929cc434055d65.png")';

        document.body.classList.add("red-theme");

        // ตั้งค่าปุ่มให้อยู่ในโหมดคัดลอก
        isReadyToCopy = true;
        const script = document.getElementById("scriptBox");
        const button = document.getElementById("actionBtn");
        button.disabled = false;
        button.innerText = "คัดลอกสคริปต์";
        
        document.getElementById("boxLabel").innerText = "-- OBFUSCATED SCRIPT (READY TO COPY) --";
        script.disabled = false;
      }

      function resetButtonNormal() {
        const script = document.getElementById("scriptBox");
        const button = document.getElementById("actionBtn");
        script.disabled = false;
        button.disabled = false;
        button.innerText = "เริ่มปกปิดสคริปต์";
      }
    </script>
