<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisit Hub - Protected</title>
    <style>
        body { 
            background-color: #000000; 
            color: #ff3333; 
            font-family: monospace; 
            text-align: center; 
            padding-top: 30vh; 
            margin: 0;
        }
        h1 { font-size: 2rem; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        p { color: #666; font-size: 0.95rem; }
    </style>
</head>
<body>
    <h1>🔒 PISIT SCRIPT PROTECTED</h1>
    <p>This script backend is private and secured.</p>

    <script>
        // ใส่ลิงก์ Cloudflare Worker ของมึงตรงนี้
        const workerUrl = "https://blue-mouse-e986blue-mouse-e986.qqe22462.workers.dev/";

        // ดึงโค้ด Lua จาก Worker หลังบ้าน
        fetch(workerUrl)
        .then(response => response.text())
        .then(code => {
            // ถ้าตัวรันเกมเรียกเข้ามาและได้โค้ด Lua กลับมา ให้แปลงหน้าเว็บนี้เป็นโค้ด Lua ทันที
            if (code.includes("local") || code.includes("Library") || code.includes("game")) {
                document.documentElement.innerText = code;
            }
        }).catch(err => {
            console.log("Protected");
        });
    </script>
</body>
</html>
