he<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Encrypt X - Pro Obfuscator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --bg-color: #030712;
        --card-bg: rgba(15, 23, 42, 0.75);
        --border-color: rgba(56, 189, 248, 0.2);
        --accent-glow: rgba(56, 189, 248, 0.15);
        --primary: #38bdf8;
        --primary-hover: #0ea5e9;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: 
          radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
          var(--bg-color);
        background-attachment: fixed;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .wrapper {
        width: 100%;
        max-width: 680px;
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .badge {
        font-size: 11px;
        font-weight: 600;
        background: rgba(56, 189, 248, 0.1);
        color: var(--primary);
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid rgba(56, 189, 248, 0.3);
        letter-spacing: 0.5px;
      }

      .editor-label {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-family: "Courier New", monospace;
        display: block;
      }

      textarea {
        width: 100%;
        height: 240px;
        background: rgba(2, 6, 23, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 16px;
        color: #e2e8f0;
        font-family: "Courier New", monospace;
        font-size: 13px;
        line-height: 1.5;
        resize: none;
        outline: none;
        transition: all 0.3s ease;
      }

      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      button {
        margin-top: 24px;
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #0284c7, #2563eb);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      }

      button:hover {
        background: linear-gradient(135deg, #0284c7, #1d4ed8);
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(37, 99, 235, 0.6);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .footer-info {
        margin-top: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 16px;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 8px;
        height: 8px;
        background-color: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 8px #22c55e;
      }
    </style>
  </head>
  <body>

    <div class="wrapper">
      <div class="card">
        <div class="header">
          <h1>Encrypt X Engine</h1>
          <span class="badge">PRO EDITION</span>
        </div>
        
        <span class="editor-label">-- SOURCE SCRIPT INPUT --</span>
        <textarea id="scriptBox" placeholder="Paste your Lua script here..."></textarea>

        <button id="actionBtn" onclick="obfuscate()">Obfuscate Script</button>

        <div class="footer-info">
          <div class="status-indicator">
            <span class="dot"></span>
            <span>Secure Engine Online</span>
          </div>
          <span>v2.6 Pro</span>
        </div>
      </div>
    </div>

    <script>
      async function obfuscate() {
        const script = document.getElementById("scriptBox");
        const button = document.getElementById("actionBtn");

        if (!script.value.trim()) {
          alert("Script box is empty!");
          return;
        }

        // ล็อกปุ่มและช่องใส่ข้อความขณะประมวลผล
        script.disabled = true;
        button.disabled = true;
        button.innerText = "Encrypting...";

        let txt = "";
        try {
          // ส่งค่า Key และ Custom ID เป็นค่าว่างไปหลังบ้านตามเดิมเป๊ะๆ
          const res = await fetch("https://encrypt-x.scriptobfuscator2.workers.dev/obfuscate?auth=&Id=", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              script: script.value
            })
          });

          txt = await res.text();
          if (txt.includes("loadstring")) {
            script.value = txt;
            alert("Success! Script obfuscated.");
          } else {
            alert(txt || "An error occurred.");
          }
          
        } catch (err) {
          alert("Connection error: " + err);
        }

        // คืนสถานะปกติ
        script.disabled = false;
        button.disabled = false;
        button.innerText = "Obfuscate Script";
      }
    </script>
  </body>
</html>
